name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            iac:
              - 'infra/**'
              - '.checkov.yaml'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Worktrunk 0.80.0
        env:
          WORKTRUNK_VERSION: 0.80.0
          WORKTRUNK_SHA256: 532ce3ed5eecb1be274c925b5887f61671e2434a4ca2561b9a8ac9379dbba199
        run: |
          asset="worktrunk-x86_64-unknown-linux-musl.tar.xz"
          url="https://github.com/max-sixty/worktrunk/releases/download/v${WORKTRUNK_VERSION}/${asset}"
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/$asset"
          echo "$WORKTRUNK_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/worktrunk-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Checkout pull request head for coverage
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: coverage-head
      - name: Run Python coverage on pull request head
        if: github.event_name == 'pull_request'
        working-directory: coverage-head
        run: make -f "$GITHUB_WORKSPACE/coverage-head/Makefile" test-coverage COVERAGE_DIR="$RUNNER_TEMP/python-coverage/head"
      - name: Run Python coverage on push head
        if: github.event_name == 'push'
        run: make test-coverage COVERAGE_DIR="$RUNNER_TEMP/python-coverage/head"
      - name: Checkout pull request base for coverage
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: coverage-base
      - name: Run Python coverage on pull request base
        if: github.event_name == 'pull_request'
        working-directory: coverage-base
        run: make -f "$GITHUB_WORKSPACE/coverage-head/Makefile" test-coverage COVERAGE_DIR="$RUNNER_TEMP/python-coverage/base"
      - name: Add coverage comparison to the job summary
        env:
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          NO_BASE_REASON: This workflow run is a push to master, so no pull-request base is available.
        run: |
          args=(
            --head-report "$RUNNER_TEMP/python-coverage/head/coverage.json"
            --head-revision "$HEAD_REVISION"
            --summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ -n "$BASE_REVISION" ]]; then
            args+=(--base-report "$RUNNER_TEMP/python-coverage/base/coverage.json")
            args+=(--base-revision "$BASE_REVISION")
          else
            args+=(--no-base-reason "$NO_BASE_REASON")
          fi
          python "$GITHUB_WORKSPACE/.github/scripts/coverage_summary.py" "${args[@]}"
      - name: Upload Python coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-reports
          path: ${{ runner.temp }}/python-coverage/
          if-no-files-found: error
      # OpenTofu validation lives here as steps, not as a third job. No GitHub
      # credentials: init skips the backend and validate never calls the API.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/github/.opentofu-version
          tofu_wrapper: false
      - name: Check OpenTofu formatting
        run: make -C infra/github check-fmt
      - name: Validate OpenTofu
        run: make -C infra/github validate
      - name: Install Checkov and scan OpenTofu policy
        if: steps.changes.outputs.iac == 'true'
        run: |
          uv tool install checkov==3.2.472
          make -C infra/github checkov
