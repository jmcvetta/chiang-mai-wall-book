# Validate the pull-request title and project the release from the same runner.
#
# This is the second of the repository's two CI jobs, beside `Checks`. It has
# no path filter, so the required context reports on every pull request head.
# Release-please's own release pull requests keep the title check and skip
# only the projection steps: they already carry their calculated version.
# A title failure does not hide the projection, and a projection failure is a
# job failure: there is no continue-on-error. A projection of no release is a
# valid result, not an error.
name: Release Projection

on:
  pull_request:
    branches: [master]
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: release-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-projection:
    name: Release Projection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No comments inside this block: the action splits it on newlines.
          types: |
            feat
            feature
            fix
            perf
            revert
            docs
            style
            chore
            refactor
            test
            build
            ci
          requireScope: false

      # Full history, so the changed-file diff runs from the merge base and
      # commit file lists are read locally. `!cancelled()` keeps projection
      # running after a title failure. Only the base-repository workflow runs
      # here; no pull-request code is executed.
      - id: checkout
        if: ${{ !cancelled() && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: ${{ !cancelled() && !startsWith(github.event.pull_request.head.ref, 'release-please--') && steps.checkout.outcome == 'success' }}
        uses: jmcvetta/projected-releases-action@v0
